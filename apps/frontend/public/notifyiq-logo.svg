<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50" fill="none">
  <defs>
    <linearGradient id="iqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Container -->
  <rect x="5" y="5" width="40" height="40" rx="10" fill="url(#iqGrad)" />
  
  <!-- Subtle Inner Border -->
  <rect x="5.5" y="5.5" width="39" height="39" rx="9.5" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1" />

  <!-- Monogram IQ -->
  <text x="25" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">IQ</text>
  
  <!-- Pulse Notification Accent Dot -->
  <circle cx="37" cy="11" r="3.5" fill="#38ef7d" stroke="#ffffff" stroke-width="1.5" />

  <!-- Typography: NotifyIQ -->
  <text x="56" y="29" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="currentColor" letter-spacing="-0.5">Notify<tspan fill="#059669">IQ</tspan></text>
  
  <!-- Subtitle Tag -->
  <text x="57" y="41" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" fill="#64748b" letter-spacing="1.2">META WABA ENGINE</text>
</svg>
